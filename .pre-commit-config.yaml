# Local pre-commit hooks. husky owns the git hook (core.hooksPath = web/.husky)
# and web/.husky/pre-commit runs these hooks, so never `pre-commit install`.
#
# `git commit` runs ruff lint + format on the staged files. The CI
# `test` job (.github/workflows/ci.yml) runs the same checks plus mypy as the gate.
#
# `uv run pre-commit run --all-files` runs the hooks across the whole repo on demand.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this roughly in step with the ruff version in pyproject.toml [dependency-groups].
    rev: v0.14.1
    hooks:
      - id: ruff          # lint (with autofix)
        args: [--fix]
      - id: ruff-format   # format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^shirin/assets/fonts/  # generated by scripts/build_font_metrics.py
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: no-commit-to-branch  # blocks commits on main/master; branch first
      - id: check-added-large-files  # > 500 KB; skips Git LFS files (notebooks)
        exclude: (^|/)(uv\.lock|package-lock\.json)$

  # Blocks committed secrets (API keys, tokens, private keys). Allowlist a false positive
  # with a `gitleaks:allow` comment on that line, never by disabling the hook.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: no-dashes-or-emojis
        name: no em/en dashes or emojis (use plain hyphens)
        language: pygrep
        # pygrep matches UTF-8 bytes: en/em dash U+2013-2014, symbols U+2600-27BF, emoji U+1F300-1FAFF.
        entry: '\xe2\x80[\x93\x94]|\xe2[\x98-\x9e]|\xf0\x9f[\x8c-\xab]'
        types: [text]
        # web/AGENTS.md: rewritten by `next dev` with its own em dashes.
        exclude: (^|/)(uv\.lock|package-lock\.json)$|^web/AGENTS\.md$
      - id: no-data-or-models
        name: no data, weights or run outputs (gitignored data/, models/, plots/)
        language: fail
        entry: Data, weights and run outputs never go in git.
        files: ^(data|models|plots)/|\.(csv|tsv|parquet|feather|xlsx?|pkl|pickle|joblib|npy|npz|h5|pt|pth|ckpt|onnx|safetensors)$
      - id: no-manual-migrations
        name: no manual SQL migration files (Supabase MCP apply_migration only)
        language: fail
        entry: DB changes go through Supabase MCP apply_migration, not migration files.
        files: ^supabase/|(^|/)migrations/.*\.sql$
