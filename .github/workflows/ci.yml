name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Jobs only read the repo; keeps the token read-only whatever the repo default is.
permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      # python-version makes every uv command use this interpreter, not the project default.
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Check interpreter
        run: uv run python -c "import sys; assert sys.version.startswith('${{ matrix.python-version }}.'), sys.version"

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Run tests
        run: uv run python -m pytest -v

      # Repo hooks (dashes, secrets, large files) as a gate --no-verify can't skip.
      # no-commit-to-branch skipped: CI also runs on the push to master after a merge.
      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch

  web:
    name: Web - build, lint, types, format, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # prebuild builds the wheel and docstrings.json, which the typecheck imports.
      - name: Build
        run: npm run build

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
