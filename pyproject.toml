[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shirin"
version = "4.1.3"
description = "A data analysis toolkit for statistical computing, visualization, and SQL operations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas>=2.0",
]

[project.optional-dependencies]
sql = [
    "ibm-db-sa",
    "sqlalchemy>=2.0",
    "pyarrow>=14",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "shirin[sql]",
    "ipykernel",
    "jupyter",
    "pytest>=8.4.2",
    "fonttools",
    "ruff",
]

[tool.ruff]
target-version = "py39"
line-length = 120
# Playground snippets share globals across cells; claude_plugin.py holds shell commands.
extend-exclude = ["web/examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
shirin = ["assets/fonts/*.woff2", "assets/fonts/*.json"]

[tool.setuptools.packages.find]
include = ["shirin*"]
exclude = ["tests*", "docs*", "scripts*"]

