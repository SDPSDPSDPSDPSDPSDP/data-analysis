[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shirin"
version = "5.1.1"
description = "A data analysis toolkit for statistical computing, visualization, and SQL operations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas>=2.0",
    # Notebook PNG copy of each chart; no wheel for Pyodide, where the playground shows SVG only.
    "resvg-py>=0.2.1; sys_platform != 'emscripten'",
]

[project.optional-dependencies]
sql = [
    "ibm-db-sa",
    "sqlalchemy>=2.0",
    "pyarrow>=14",
    "python-dotenv>=1.2.1",
    "tqdm",
]

[dependency-groups]
dev = [
    "shirin[sql]",
    "ipykernel",
    "jupyter",
    "pytest>=8.4.2",
    "fonttools",
    "ruff>=0.14.1",
    "pytest-cov>=5.0.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
target-version = "py39"
line-length = 120
# Playground snippets share globals across cells; claude_plugin.py holds shell commands.
extend-exclude = ["web/examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ASYNC", "LOG", "G", "SIM", "RUF", "TID251", "C90", "INP001", "T20"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
# Same limit as ESLint `complexity` in web/eslint.config.mjs.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# pytest collects tests/ by path, not as a package.
"tests/**" = ["TID251", "INP001"]
# Standalone CLI scripts: stdout is their interface.
"scripts/**" = ["INP001", "T20"]
"web/scripts/**" = ["INP001", "T20"]
# describe() prints its summary: stdout is its contract.
"shirin/stats/descriptive_statistics.py" = ["T20"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"abc.ABC".msg = "One implementation = concrete class; two = typing.Protocol, not an ABC."
"abc.ABCMeta".msg = "One implementation = concrete class; two = typing.Protocol, not an ABC."
"abc.abstractmethod".msg = "One implementation = concrete class; two = typing.Protocol, not an ABC."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=shirin",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--junitxml=junit.xml",
    "--cov-fail-under=80",
]

[tool.coverage.report]
exclude_also = [
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
    'raise NotImplementedError',
]

[tool.mypy]
python_version = "3.9"
files = ["shirin"]
# Pragmatic, not --strict: every def must be annotated, no strict Any checks.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Tests may stay loosely typed; don't let them gate the type-check job.
module = "tests.*"
ignore_errors = true

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
shirin = ["assets/fonts/*.woff2", "assets/fonts/*.ttf", "assets/fonts/*.json"]

[tool.setuptools.packages.find]
include = ["shirin*"]
exclude = ["tests*", "docs*", "scripts*"]
